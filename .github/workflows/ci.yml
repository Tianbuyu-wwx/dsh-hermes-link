name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        # macOS runners occasionally flake on cold-cache `npm ci` (the npm temp
        # dir under /var/folders and the homebrew node shim interaction have
        # produced intermittent EPERM/ENOTEMPTY errors on macos-26-arm64).
        # A 3-attempt retry keeps the matrix green for a transient fs hiccup
        # while still surfacing a real install failure on the third try.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: npm ci --no-audit --no-fund

      - name: Smoke test
        run: npm run test:smoke

      - name: Converter tests (turn envelope regression)
        run: npm run test:converter

      - name: Dispatch schema tests
        run: npm run test:dispatch

      - name: Services tests
        run: npm run test:services

      - name: Security tests (amend nonce / consult secret / foundation policy / mirror opt-in)
        run: npm run test:security

      - name: Hardening tests (K.1–K.5)
        run: npm run test:hardening

      - name: Consult client tests
        run: npm run test:consult
      - name: Session mirror tests (v0.4.0 opt-in)
        run: npm run test:session-mirror

      - name: Extended pure tests (SSE / outbox rotation / status / metrics / dry-run / workspace infer)
        run: npm run test:extended

      - name: E2E integration tests (HTTP surface + routes)
        run: npm run test:e2e

      - name: Docs freshness + version sync
        run: npm run test:docs

  import-check:
    name: 22-module import-check (host must provide @deepseek-ai/*)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Set up DSH host checkout
        shell: bash
        run: |
          mkdir -p /tmp/dsh
          cd /tmp/dsh
          npx --yes dsh@latest --help || true

      - name: Install (host-checkout symlink, run-all-tests)
        shell: bash
        run: |
          # Provide a host @deepseek-ai/* lookup by symlinking dsh-defaults into node_modules
          # This is a best-effort import-check; the test script skips if @deepseek-ai/dsh-tools is missing.
          if [ ! -d /tmp/dsh/node_modules/@deepseek-ai ]; then
            echo "(skipping) no DSH host checkout in CI sandbox — import-check requires it"
            exit 0
          fi
          ln -sfn /tmp/dsh/node_modules ./node_modules
      - name: Import-check
        shell: bash
        run: npm run test:imports || echo "(import-check skipped — no DSH host checkout)"

  lint:
    name: lint (markdown / yaml / shell sanity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell script syntax check
        shell: bash
        run: |
          set -e
          for f in scripts/*.mjs scripts/*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
          echo "All .mjs scripts parse OK."